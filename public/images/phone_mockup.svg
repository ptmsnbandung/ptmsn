<svg width="68" height="132" viewBox="0 0 68 132" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Phone Chassis Shadow -->
    <rect x="3" y="3" width="62" height="126" rx="16" fill="#030712" />
    
    <!-- Outer Titanium Bezel -->
    <rect x="2" y="2" width="64" height="128" rx="16" stroke="#475569" stroke-width="1.8" />
    <rect x="3.5" y="3.5" width="61" height="125" rx="14.5" stroke="#0f172a" stroke-width="1.2" />
    
    <!-- Side Buttons (Realistic iPhone Details) -->
    <!-- Left: Silent Switch -->
    <rect x="0.5" y="22" width="2" height="5" rx="1" fill="#64748b" />
    <!-- Left: Volume Up -->
    <rect x="0.5" y="32" width="2" height="11" rx="1" fill="#64748b" />
    <!-- Left: Volume Down -->
    <rect x="0.5" y="47" width="2" height="11" rx="1" fill="#64748b" />
    <!-- Right: Power / Lock Button -->
    <rect x="65.5" y="35" width="2" height="16" rx="1" fill="#64748b" />

    <!-- Edge-to-Edge Clean White Screen Display -->
    <rect x="5" y="5" width="58" height="122" rx="13" fill="#FFFFFF" />

    <!-- Top iPhone Dynamic Island / Notch -->
    <rect x="22" y="7" width="24" height="6" rx="3" fill="#0B132B" />
    <!-- Camera Lens & Sensor -->
    <circle cx="38" cy="10" r="1.3" fill="#1E293B" />
    <circle cx="38" cy="10" r="0.5" fill="#3B82F6" opacity="0.6" />
    <rect x="26" y="9.2" width="6" height="1.4" rx="0.7" fill="#1E293B" />

    <!-- Screen Content: PT MSN Logo & Branding -->
    <g transform="translate(19, 36)">
        <!-- Blue Node 1 -->
        <circle cx="6" cy="22" r="3.5" fill="#0284c7" />
        <circle cx="6" cy="22" r="1.5" fill="#FFFFFF" />
        <!-- Blue Node 2 (Top) -->
        <circle cx="15" cy="8" r="4.2" fill="#0369a1" />
        <circle cx="15" cy="8" r="1.8" fill="#FFFFFF" />
        <!-- Blue Node 3 (Right) -->
        <circle cx="24" cy="19" r="4" fill="#0ea5e9" />
        <circle cx="24" cy="19" r="1.6" fill="#FFFFFF" />
        <!-- Connection Lines -->
        <path d="M6 22 L15 8 L24 19" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M6 22 L2 27" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" />
        <circle cx="2" cy="27" r="2" fill="#38bdf8" />
    </g>

    <!-- Typography: PT MSN & MyMSN Pill -->
    <text x="34" y="75" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7" font-weight="900" text-anchor="middle" fill="#0f172a" letter-spacing="0.3">PT MSN</text>
    <rect x="17" y="80" width="34" height="9" rx="4.5" fill="#0284c7" />
    <text x="34" y="86.8" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="5" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="0.5">MyMSN</text>

    <!-- Bottom Home Indicator Bar -->
    <rect x="22" y="121" width="24" height="2" rx="1" fill="#94A3B8" />

    <!-- Glass Glare Reflection Overlay -->
    <path d="M5 5 L42 5 L12 127 L5 127 Z" fill="url(#screenGlare)" opacity="0.12" />
    
    <defs>
        <linearGradient id="screenGlare" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
    </defs>
</svg>