    <!-- Signal waves & nodes -->
    <circle cx="16" cy="32" r="3.5" fill="#FFFFFF" />
    <circle cx="24" cy="18" r="4" fill="#FFFFFF" />
    <circle cx="32" cy="28" r="3.5" fill="#FFFFFF" />
    <path d="M16 32 L24 18 L32 28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M11 19 A18 18 0 0 1 37 19" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M15 23 A12 12 0 0 1 33 23" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(62, 10)">
    <text x="0" y="24" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#0F172A">
